name: tradeguard
services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-disabled}
      TRADEGUARD_DATA: /data
      TINVEST_SANDBOX_TOKEN: ${TINVEST_SANDBOX_TOKEN:-}
      TINVEST_MCP_USE_PROXY: ${TINVEST_MCP_USE_PROXY:-0}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2048}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      LLM_DISABLE_THINKING: ${LLM_DISABLE_THINKING:-}
      LLM_MAX_INPUT_BYTES: ${LLM_MAX_INPUT_BYTES:-60000}
      LLM_MAX_CALLS: ${LLM_MAX_CALLS:-30}
      LLM_MAX_RESERVED_TOKENS: ${LLM_MAX_RESERVED_TOKENS:-200000}
      LLM_MAX_COST_USD: ${LLM_MAX_COST_USD:-1}
      LLM_ZERO_COST_CONFIRMED: ${LLM_ZERO_COST_CONFIRMED:-0}
      LLM_INPUT_USD_PER_MILLION: ${LLM_INPUT_USD_PER_MILLION:-0}
      LLM_OUTPUT_USD_PER_MILLION: ${LLM_OUTPUT_USD_PER_MILLION:-0}
    volumes:
      - mvp-data:/data
    ports:
      - "127.0.0.1:8003:8000"
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    environment:
      API_UPSTREAM: http://backend:8000
      HOST: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:5173"
volumes:
  mvp-data:
