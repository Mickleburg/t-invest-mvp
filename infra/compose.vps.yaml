# Review template: requires domain, public credentials, price ceilings and VPS smoke.
services:
  backend:
    environment:
      LLM_PROVIDER: deepseek
      LLM_BASE_URL: https://api.deepseek.com
      LLM_API_KEY: ${DEEPSEEK_API_KEY:-}
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      TRADEGUARD_DOMAIN: ${TRADEGUARD_DOMAIN:-localhost}
      AUTH_USER: ${AUTH_USER:-tradeguard}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
volumes:
  caddy-data:
  caddy-config:
