openapi: 3.1.0
info:
  title: TradeGuard MVP
  version: 0.2.0
  description: 'Implemented dialogue, versioned plans, confirmation and monitoring.
    Provisional: human review required.'
paths:
  /api/health:
    get:
      summary: Health
      operationId: health_api_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      x-implementation-status: implemented
  /api/sessions:
    get:
      summary: Sessions
      operationId: sessions_api_sessions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Session'
                type: array
                title: Response Sessions Api Sessions Get
      x-implementation-status: implemented
    post:
      summary: Create
      operationId: create_api_sessions_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionState'
      x-implementation-status: implemented
  /api/sessions/{sid}:
    get:
      summary: State
      operationId: state_api_sessions__sid__get
      parameters:
      - name: sid
        in: path
        required: true
        schema:
          type: string
          title: Sid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionState'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-implementation-status: implemented
  /api/sessions/{sid}/messages:
    post:
      summary: Message
      operationId: message_api_sessions__sid__messages_post
      parameters:
      - name: sid
        in: path
        required: true
        schema:
          type: string
          title: Sid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionState'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-implementation-status: implemented
    get:
      summary: Message History
      operationId: message_history_api_sessions__sid__messages_get
      parameters:
      - name: sid
        in: path
        required: true
        schema:
          type: string
          title: Sid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageRecord'
                title: Response Message History Api Sessions  Sid  Messages Get
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Service Unavailable
      x-implementation-status: implemented
  /api/sessions/{sid}/plan:
    get:
      summary: Session Draft
      operationId: session_draft_api_sessions__sid__plan_get
      parameters:
      - name: sid
        in: path
        required: true
        schema:
          type: string
          title: Sid
      responses:
        '200':
          description: Версия плана; ETag содержит SHA256 канонического черновика
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradePlan'
          headers:
            ETag:
              schema:
                type: string
              description: Quoted SHA256; use the 64 hex characters as content_hash
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Service Unavailable
      x-implementation-status: implemented
  /api/plans/{plan_id}:
    get:
      summary: Get Plan
      operationId: get_plan_api_plans__plan_id__get
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
          title: Plan Id
      responses:
        '200':
          description: Версия плана; ETag содержит SHA256 канонического черновика
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradePlan'
          headers:
            ETag:
              schema:
                type: string
              description: Quoted SHA256; use the 64 hex characters as content_hash
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Service Unavailable
      x-implementation-status: implemented
    patch:
      summary: Update Draft
      operationId: update_draft_api_plans__plan_id__patch
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
          title: Plan Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanPatch'
      responses:
        '200':
          description: Версия плана; ETag содержит SHA256 канонического черновика
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradePlan'
          headers:
            ETag:
              schema:
                type: string
              description: Quoted SHA256; use the 64 hex characters as content_hash
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Service Unavailable
      x-implementation-status: implemented
  /api/plans/{plan_id}/confirm:
    post:
      summary: Confirm Version
      operationId: confirm_version_api_plans__plan_id__confirm_post
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
          title: Plan Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanConfirmation'
      responses:
        '200':
          description: Версия плана; ETag содержит SHA256 канонического черновика
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradePlan'
          headers:
            ETag:
              schema:
                type: string
              description: Quoted SHA256; use the 64 hex characters as content_hash
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Service Unavailable
      x-implementation-status: implemented
  /api/plans/{plan_id}/monitoring:
    get:
      summary: Monitoring State
      operationId: monitoring_state_api_plans__plan_id__monitoring_get
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
          title: Plan Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringState'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Service Unavailable
      x-implementation-status: implemented
  /api/plans/{plan_id}/checks:
    get:
      summary: Checks
      operationId: checks_api_plans__plan_id__checks_get
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
          title: Plan Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Check'
                title: Response Checks Api Plans  Plan Id  Checks Get
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Service Unavailable
      x-implementation-status: implemented
  /api/plans/{plan_id}/notifications:
    get:
      summary: Notifications
      operationId: notifications_api_plans__plan_id__notifications_get
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
          title: Plan Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
                title: Response Notifications Api Plans  Plan Id  Notifications Get
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Service Unavailable
      x-implementation-status: implemented
  /api/plans/{plan_id}/notifications/{notification_id}/ack:
    post:
      summary: Acknowledge Notification
      operationId: acknowledge_notification_api_plans__plan_id__notifications__notification_id__ack_post
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
          title: Plan Id
      - name: notification_id
        in: path
        required: true
        schema:
          type: string
          title: Notification Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Service Unavailable
      x-implementation-status: implemented
components:
  schemas:
    Check:
      properties:
        id:
          type: string
          title: Id
        plan_id:
          type: string
          title: Plan Id
        plan_version:
          type: integer
          title: Plan Version
        rule_id:
          type: string
          title: Rule Id
        checked_at:
          type: string
          title: Checked At
        status:
          type: string
          enum:
          - satisfied
          - affected
          - insufficient_data
          - error
          title: Status
        source_ids:
          items:
            type: string
          type: array
          title: Source Ids
        observed_value:
          anyOf:
          - type: string
          - type: 'null'
          title: Observed Value
      additionalProperties: false
      type: object
      required:
      - id
      - plan_id
      - plan_version
      - rule_id
      - checked_at
      - status
      - source_ids
      - observed_value
      title: Check
    Error:
      properties:
        detail:
          type: string
          title: Detail
      additionalProperties: false
      type: object
      required:
      - detail
      title: Error
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Health:
      properties:
        prompt_version:
          type: string
          title: Prompt Version
        trading:
          type: boolean
          const: false
          title: Trading
        data_source:
          type: string
          title: Data Source
        llm_provider:
          type: string
          title: Llm Provider
          default: local_codex
        llm_configured:
          type: boolean
          title: Llm Configured
          default: true
        monitoring_enabled:
          type: boolean
          title: Monitoring Enabled
          default: false
      additionalProperties: false
      type: object
      required:
      - prompt_version
      - trading
      - data_source
      title: Health
    Message:
      properties:
        text:
          type: string
          maxLength: 5000
          minLength: 1
          title: Text
        request_id:
          type: string
          format: uuid
          title: Request Id
        educational:
          type: boolean
          title: Educational
          default: false
      additionalProperties: false
      type: object
      required:
      - text
      - request_id
      title: Message
    MessageRecord:
      properties:
        id:
          type: integer
          title: Id
        session_id:
          type: string
          title: Session Id
        role:
          type: string
          enum:
          - user
          - assistant
          title: Role
        text:
          type: string
          title: Text
        created_at:
          type: string
          title: Created At
        response:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Response
      additionalProperties: false
      type: object
      required:
      - id
      - session_id
      - role
      - text
      - created_at
      - response
      title: MessageRecord
    MonitoringState:
      properties:
        plan_id:
          type: string
          title: Plan Id
        confirmed_version:
          type: integer
          title: Confirmed Version
        state:
          type: string
          enum:
          - not_started
          - active
          - paused
          - error
          title: State
        last_checked_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Checked At
        next_check_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Check At
      additionalProperties: false
      type: object
      required:
      - plan_id
      - confirmed_version
      - state
      - last_checked_at
      - next_check_at
      title: MonitoringState
    Notification:
      properties:
        id:
          type: string
          title: Id
        plan_id:
          type: string
          title: Plan Id
        plan_version:
          type: integer
          title: Plan Version
        check_id:
          type: string
          title: Check Id
        created_at:
          type: string
          title: Created At
        text:
          type: string
          title: Text
        delivery_status:
          type: string
          enum:
          - stored
          - delivered
          - failed
          title: Delivery Status
      additionalProperties: false
      type: object
      required:
      - id
      - plan_id
      - plan_version
      - check_id
      - created_at
      - text
      - delivery_status
      title: Notification
    PlanConfirmation:
      properties:
        version:
          type: integer
          minimum: 1.0
          title: Version
        content_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
          title: Content Hash
        request_id:
          type: string
          format: uuid
          title: Request Id
      additionalProperties: false
      type: object
      required:
      - version
      - content_hash
      - request_id
      title: PlanConfirmation
    PlanPatch:
      properties:
        expected_version:
          type: integer
          minimum: 1.0
          title: Expected Version
        changes:
          $ref: '#/components/schemas/PlanChanges'
      additionalProperties: false
      type: object
      required:
      - expected_version
      - changes
      title: PlanPatch
    Session:
      properties:
        id:
          type: string
          title: Id
        title:
          type: string
          title: Title
        created_at:
          type: string
          title: Created At
        processing:
          type: integer
          enum:
          - 0
          - 1
          title: Processing
      additionalProperties: false
      type: object
      required:
      - id
      - title
      - created_at
      - processing
      title: Session
    SessionState:
      properties:
        session:
          $ref: '#/components/schemas/Session'
        messages:
          items:
            $ref: '#/components/schemas/MessageRecord'
          type: array
          title: Messages
        evidence:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Evidence
      additionalProperties: false
      type: object
      required:
      - session
      - messages
      - evidence
      title: SessionState
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    TradePlan:
      title: TradeGuard versioned plan (not a brokerage order)
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        status:
          enum:
          - draft
          - confirmed
          - archived
        educational:
          type: boolean
        session_id:
          type: string
        instrument:
          $ref: '#/components/schemas/Plan_Instrument'
        direction:
          enum:
          - long
          - short
        hypothesis:
          type: string
        basis:
          type: array
          items:
            type: string
        counterarguments:
          type: array
          items:
            type: string
        horizon:
          type: string
        entry_conditions:
          type: array
          items:
            type: string
        exit_conditions:
          type: array
          items:
            type: string
        review_conditions:
          type: array
          items:
            type: string
        parameters:
          $ref: '#/components/schemas/Plan_Parameters'
        risk:
          $ref: '#/components/schemas/Plan_Risk'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Plan_Rule'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Plan_Source'
        missing:
          type: array
          items:
            type: string
        confirmation:
          $ref: '#/components/schemas/Plan_Confirmation'
      required:
      - id
      - version
      - status
      - educational
      allOf:
      - if:
          properties:
            status:
              const: confirmed
        then:
          required:
          - instrument
          - direction
          - hypothesis
          - horizon
          - entry_conditions
          - exit_conditions
          - review_conditions
          - parameters
          - risk
          - rules
          - sources
          - confirmation
          properties:
            hypothesis:
              minLength: 1
            entry_conditions:
              minItems: 1
            exit_conditions:
              minItems: 1
            review_conditions:
              minItems: 1
            sources:
              minItems: 1
            rules:
              minItems: 1
            missing:
              maxItems: 0
            parameters:
              required:
              - entry
              - stop
              - quantity
              - price_unit
            risk:
              required:
              - limit
              - calculation
              - engine_version
              properties:
                status:
                  const: calculated
                missing:
                  maxItems: 0
      - if:
          properties:
            status:
              const: confirmed
            instrument:
              properties:
                kind:
                  const: future
              required:
              - kind
          required:
          - instrument
        then:
          properties:
            instrument:
              required:
              - spec_source_id
            parameters:
              required:
              - point_value
              - point_value_currency
              - lot_size
      - if:
          properties:
            status:
              const: confirmed
            educational:
              const: false
        then:
          properties:
            sources:
              items:
                properties:
                  synthetic:
                    const: false
                  freshness:
                    const: available
    Plan_Instrument:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        ticker:
          type: string
        class_code:
          type: string
        kind:
          enum:
          - share
          - future
        name:
          type: string
        spec_source_id:
          type: string
      required:
      - id
      - ticker
      - class_code
      - kind
    Plan_Source:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          enum:
          - mcp
          - issuer
          - news
          - user
          - fixture
        locator:
          type: string
        retrieved_at:
          type: string
          format: date-time
        observed_at:
          type:
          - string
          - 'null'
          format: date-time
        freshness:
          enum:
          - available
          - stale
          - unknown
        synthetic:
          type: boolean
      required:
      - id
      - kind
      - locator
      - retrieved_at
      - freshness
      - synthetic
    Plan_Rule:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        metric:
          enum:
          - price
          - manual_event
        operator:
          enum:
          - lt
          - lte
          - gt
          - gte
          - manual
        threshold:
          type: string
          pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
        unit:
          type: string
        automatic:
          type: boolean
        source_ids:
          type: array
          items:
            type: string
        max_age_seconds:
          type: integer
          minimum: 1
      required:
      - id
      - metric
      - operator
      - automatic
      - source_ids
      allOf:
      - if:
          properties:
            automatic:
              const: true
        then:
          required:
          - threshold
          - unit
          - max_age_seconds
          properties:
            metric:
              const: price
            operator:
              enum:
              - lt
              - lte
              - gt
              - gte
    Plan_Parameters:
      type: object
      additionalProperties: false
