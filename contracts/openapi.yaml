openapi: 3.1.0
info:
  title: TradeGuard MVP
  version: 0.1.0
  description: Implemented prototype subset + proposed CP2/CP3 operations. x-implementation-status
    is normative; planned paths are not served.
paths:
  /api/health:
    get:
      summary: Health
      operationId: health_api_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      x-implementation-status: implemented
  /api/sessions:
    get:
      summary: Sessions
      operationId: sessions_api_sessions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Session'
                type: array
                title: Response Sessions Api Sessions Get
      x-implementation-status: implemented
    post:
      summary: Create
      operationId: create_api_sessions_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionState'
      x-implementation-status: implemented
  /api/sessions/{sid}:
    get:
      summary: State
      operationId: state_api_sessions__sid__get
      parameters:
      - name: sid
        in: path
        required: true
        schema:
          type: string
          title: Sid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionState'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-implementation-status: implemented
  /api/sessions/{sid}/messages:
    post:
      summary: Message
      operationId: message_api_sessions__sid__messages_post
      parameters:
      - name: sid
        in: path
        required: true
        schema:
          type: string
          title: Sid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionState'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-implementation-status: implemented
    get:
      operationId: message_history
      summary: message_history
      description: PLANNED, not implemented. Calling this route today returns 404;
        responses below are the target contract.
      x-implementation-status: planned
      parameters:
      - name: sid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Target success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageRecord'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Stale version/hash, already confirmed or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Incomplete/invalid plan or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Source/provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/sessions/{sid}/plan:
    get:
      operationId: session_draft
      summary: session_draft
      description: PLANNED, not implemented. Calling this route today returns 404;
        responses below are the target contract.
      x-implementation-status: planned
      parameters:
      - name: sid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Target success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradePlan'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Stale version/hash, already confirmed or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Incomplete/invalid plan or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Source/provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/plans/{plan_id}:
    get:
      operationId: get_plan
      summary: get_plan
      description: PLANNED, not implemented. Calling this route today returns 404;
        responses below are the target contract.
      x-implementation-status: planned
      parameters: &id001
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Target success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradePlan'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Stale version/hash, already confirmed or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Incomplete/invalid plan or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Source/provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: update_draft
      summary: update_draft
      description: PLANNED, not implemented. Calling this route today returns 404;
        responses below are the target contract.
      x-implementation-status: planned
      parameters: *id001
      responses:
        '200':
          description: Target success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradePlan'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Stale version/hash, already confirmed or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Incomplete/invalid plan or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Source/provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanPatch'
  /api/plans/{plan_id}/confirm:
    post:
      operationId: confirm_version
      summary: confirm_version
      description: PLANNED, not implemented. Calling this route today returns 404;
        responses below are the target contract.
      x-implementation-status: planned
      parameters: *id001
      responses:
        '200':
          description: Target success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradePlan'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Stale version/hash, already confirmed or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Incomplete/invalid plan or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Source/provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanConfirmation'
  /api/plans/{plan_id}/monitoring:
    get:
      operationId: monitoring_state
      summary: monitoring_state
      description: PLANNED, not implemented. Calling this route today returns 404;
        responses below are the target contract.
      x-implementation-status: planned
      parameters: *id001
      responses:
        '200':
          description: Target success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringState'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Stale version/hash, already confirmed or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Incomplete/invalid plan or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Source/provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/plans/{plan_id}/notifications:
    get:
      operationId: notifications
      summary: notifications
      description: PLANNED, not implemented. Calling this route today returns 404;
        responses below are the target contract.
      x-implementation-status: planned
      parameters: *id001
      responses:
        '200':
          description: Target success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Stale version/hash, already confirmed or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Incomplete/invalid plan or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Source/provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/plans/{plan_id}/checks:
    get:
      operationId: checks
      summary: checks
      description: PLANNED, not implemented. Calling this route today returns 404;
        responses below are the target contract.
      x-implementation-status: planned
      parameters: *id001
      responses:
        '200':
          description: Target success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Check'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Stale version/hash, already confirmed or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Incomplete/invalid plan or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Source/provider unavailable
          content:
            application/json:
              schema:
